name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  # 公开 runner 上恒可跑：静态检查 + 公开树敏感信息扫描。
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'ruff>=0.15,<1'
      - name: Lint
        run: ruff check plugin
      - name: Byte-compile
        run: python -m compileall -q plugin
      - name: Public tree scan (secrets / real identifiers)
        run: python scripts/check_public_tree.py

  # 业务用例依赖 Hermes 运行时（gateway 包），公开 runner 上没有它。
  # 需要的仓库在自己机器上装 Hermes 后设置仓库变量 HERMES_RUNTIME=true 即可启用；
  # 默认跳过（skip 不算失败），避免公开仓出现"环境缺件"的假红叉。
  tests:
    if: ${{ vars.HERMES_RUNTIME == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest plugin/tests -q
